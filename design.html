<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dental Access Portal Design</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=Public+Sans:wght@400;600;700&display=swap">
<style>
  :root { --bg: #FAFCFB; --ink: #0E1F1B; --deep: #0B4F46; --muted: #5C7370; --warn-bg: #FBF0E2; --warn-bd: #E3C593; --warn-ink: #6B4310; color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: 'Public Sans', -apple-system, system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; padding: 12px 16px; border-bottom: 1px solid #E3EDEA; }
  h1 { font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 20px; margin: 0; color: var(--deep); }
  .note { font-size: 13.5px; line-height: 1.45; color: var(--warn-ink); background: var(--warn-bg); border: 1px solid var(--warn-bd); border-radius: 999px; padding: 6px 14px; }
  a { color: var(--deep); font-weight: 600; font-size: 14px; }
  iframe { flex: 1; width: 100%; border: 0; display: block; }
</style>
</head>
<body>
<header>
  <h1>Dental Access Portal &middot; design prototype</h1>
  <span class="note">Not an NHS service. Practices, prices and counts are sample data for design review.</span>
  <span><a href="index.html">Try the demo portal</a> &middot; <a href="canvas.html" target="_blank" rel="noopener">Open full screen</a></span>
</header>
<iframe src="canvas.html" title="Dental Access Portal design canvas"></iframe>
</body>
</html>
